services:
  app:
    gpus: all
    build:
      context: .
    container_name: genexam-app
    init: true
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/draftwork
      LMS_URL: http://host.docker.internal:1234
      TITLE_LMS_URL: http://host.docker.internal:1234/v1
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_CONCURRENCY_LIMIT: ${DEEPSEEK_CONCURRENCY_LIMIT:-4}
      DEEPSEEK_MAX_STRUCTURED_ATTEMPTS: ${DEEPSEEK_MAX_STRUCTURED_ATTEMPTS:-3}
      DEEPSEEK_MAX_TRANSIENT_RETRIES: ${DEEPSEEK_MAX_TRANSIENT_RETRIES:-2}
      DEEPSEEK_RETRY_BASE_SECONDS: ${DEEPSEEK_RETRY_BASE_SECONDS:-1.0}
    volumes:
      - ./data:/app/data
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: genexam-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: genexam-postgres
    environment:
      POSTGRES_DB: draftwork
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_create_evaluation_runs.sql:/docker-entrypoint-initdb.d/001_create_evaluation_runs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d draftwork"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  huggingface-cache:
