services:
  app:
    build:
      context: .
    container_name: genexam-app
    init: true
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      HOST: 0.0.0.0
      PORT: 8000
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/draftwork
      CELERY_BROKER_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_STORAGE_ROOT: data/storage
      LMS_URL: http://host.docker.internal:1234
      TITLE_LMS_URL: http://host.docker.internal:1234/v1
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_CONCURRENCY_LIMIT: ${DEEPSEEK_CONCURRENCY_LIMIT:-5}
      MAX_PARALLEL_GENERATION_CALLS: ${MAX_PARALLEL_GENERATION_CALLS:-5}
      MAX_PARALLEL_VALIDATOR_CALLS: ${MAX_PARALLEL_VALIDATOR_CALLS:-5}
      DEEPSEEK_MAX_STRUCTURED_ATTEMPTS: ${DEEPSEEK_MAX_STRUCTURED_ATTEMPTS:-3}
      DEEPSEEK_MAX_TRANSIENT_RETRIES: ${DEEPSEEK_MAX_TRANSIENT_RETRIES:-2}
      DEEPSEEK_RETRY_BASE_SECONDS: ${DEEPSEEK_RETRY_BASE_SECONDS:-1.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      STEM_REVIEW_MODEL: ${STEM_REVIEW_MODEL:-gpt-6-luna}
      STEM_REVIEW_REASONING_EFFORT: ${STEM_REVIEW_REASONING_EFFORT:-medium}
      OPENAI_INPUT_COST_PER_MTOK: ${OPENAI_INPUT_COST_PER_MTOK:-0.10}
      OPENAI_CACHED_INPUT_COST_PER_MTOK: ${OPENAI_CACHED_INPUT_COST_PER_MTOK:-0.01}
      OPENAI_OUTPUT_COST_PER_MTOK: ${OPENAI_OUTPUT_COST_PER_MTOK:-0.50}
      PLANNER_CONTEXT_TOKENS: ${PLANNER_CONTEXT_TOKENS:-120000}
      GENERATION_CONTEXT_TOKENS: ${GENERATION_CONTEXT_TOKENS:-120000}
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    gpus: all
    build:
      context: .
    container_name: genexam-worker
    init: true
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "worker", "--beat", "--loglevel=INFO", "--pool=prefork", "--concurrency=1"]
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi -L >/dev/null 2>&1 && python -c \"import os, psutil, sys; alive = any(p.pid != os.getpid() and 'celery' in ' '.join(p.info.get('cmdline') or []) and 'worker' in (p.info.get('cmdline') or []) for p in psutil.process_iter(['cmdline'])); sys.exit(0 if alive else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/draftwork
      CELERY_BROKER_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_STORAGE_ROOT: data/storage
      LMS_URL: http://host.docker.internal:1234
      TITLE_LMS_URL: http://host.docker.internal:1234/v1
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_CONCURRENCY_LIMIT: ${DEEPSEEK_CONCURRENCY_LIMIT:-5}
      MAX_PARALLEL_GENERATION_CALLS: ${MAX_PARALLEL_GENERATION_CALLS:-5}
      MAX_PARALLEL_VALIDATOR_CALLS: ${MAX_PARALLEL_VALIDATOR_CALLS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      STEM_REVIEW_MODEL: ${STEM_REVIEW_MODEL:-gpt-6-luna}
      STEM_REVIEW_REASONING_EFFORT: ${STEM_REVIEW_REASONING_EFFORT:-medium}
      OPENAI_INPUT_COST_PER_MTOK: ${OPENAI_INPUT_COST_PER_MTOK:-0.10}
      OPENAI_CACHED_INPUT_COST_PER_MTOK: ${OPENAI_CACHED_INPUT_COST_PER_MTOK:-0.01}
      OPENAI_OUTPUT_COST_PER_MTOK: ${OPENAI_OUTPUT_COST_PER_MTOK:-0.50}
      EMBEDDING_DEVICE: cuda
      EMBEDDING_REQUIRE_CUDA: "true"
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      HF_HOME: /home/app/.cache/huggingface
      TRANSFORMERS_CACHE: /home/app/.cache/huggingface/hub
      PLANNER_CONTEXT_TOKENS: ${PLANNER_CONTEXT_TOKENS:-120000}
      GENERATION_CONTEXT_TOKENS: ${GENERATION_CONTEXT_TOKENS:-120000}
      PARSING_TIMEOUT_SECONDS: 120
      GENERATION_TIMEOUT_SECONDS: 800
      JOB_HEARTBEAT_SECONDS: 30
      JOB_STALE_AFTER_SECONDS: 480
    volumes:
      - ./data:/app/data
      - huggingface-cache:/home/app/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      model-cache-init:
        condition: service_completed_successfully
    restart: unless-stopped

  model-cache-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 10001:10001 /cache"]
    volumes:
      - huggingface-cache:/cache
    restart: "no"

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/draftwork
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7.4-alpine
    container_name: genexam-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: genexam-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: genexam-postgres
    ports:
      - "${POSTGRES_PORT:-1966}:5432"
    environment:
      POSTGRES_DB: draftwork
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d draftwork"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  huggingface-cache:
  redis-data:
